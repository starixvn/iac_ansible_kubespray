---
- name: Pre-check Cluster
  hosts: localhost
  gather_facts: False
  tasks:
    - name: First control-plane Info
      debug:
        msg: "First control-plane node: {{ groups['kube_control_plane'][0] }}"
      run_once: true

    - name: Set fact first_kube_control_plane
      debug:
        msg: "{{ joined_control_planes | default([]) | first | default(groups['kube_control_plane'] | first) }}"