---
# Install NVIDIA Driver CUDA-toolkit
- name: Install Requirement
  apt:
    name: gcc=4:11.2.0-1ubuntu1
    state: present
    update_cache: yes
  become: true

- name: Copy cuda pin file
  copy:
    src: files/cuda-ubuntu2204.pin
    dest: /etc/apt/preferences.d/cuda-repository-pin-600
    owner: root
    group: root
    mode: 0644

- name: Copy repo list file
  copy:
    src: files/cuda-repo-ubuntu2204-12-5-local_12.5.0-555.42.02-1_amd64.deb
    dest: /tmp
    owner: root
    group: root
    mode: 0644

- name: Install cuda repo
  apt:
    deb: /tmp/cuda-repo-ubuntu2204-12-5-local_12.5.0-555.42.02-1_amd64.deb
  become: true

- name: Copy keyring cuda
  raw: "cp /var/cuda-repo-ubuntu2204-12-5-local/cuda-*-keyring.gpg /usr/share/keyrings/"
  become: true

- name: Install cuda-toolkit
  apt:
    name: 
      - cuda-toolkit-12-5
      - cuda-drivers
    state: present
    update_cache: yes
  become: true

